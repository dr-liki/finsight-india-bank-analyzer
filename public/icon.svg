<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="200" y1="120" x2="420" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.35"/>
  <!-- Outer Radar/Lens Ring -->
  <circle cx="256" cy="256" r="176" stroke="#1e293b" stroke-width="14" />
  <path d="M256 80 A176 176 0 0 1 432 256" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M80 256 A176 176 0 0 0 256 432" stroke="url(#skyGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Stylized Ascending Bars + Rupee Pulse -->
  <rect x="148" y="284" width="38" height="84" rx="12" fill="#0ea5e9" fill-opacity="0.85"/>
  <rect x="206" y="232" width="38" height="136" rx="12" fill="#10b981" fill-opacity="0.9"/>
  <rect x="264" y="176" width="38" height="192" rx="12" fill="url(#emeraldGrad)"/>
  <!-- Bold Geometric Rupee Symbol Overlay -->
  <path d="M172 146 H344 M172 192 H324 M254 146 C288 146 308 164 308 192 C308 222 284 242 242 242 H196 L316 368" stroke="#f8fafc" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Accent Node -->
  <circle cx="348" cy="146" r="16" fill="#34d399" />
</svg>
