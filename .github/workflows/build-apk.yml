name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building FinSight India v$VERSION (Run #${{ github.run_number }})"

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Stamp Version & Custom Vector Icon into Android Project
        run: |
          # Update versionName and versionCode inside android/app/build.gradle
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "${{ steps.pkg.outputs.version }}"/g' android/app/build.gradle || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-debug.apk

      - name: Upload Versioned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-APK
          path: android/app/build/outputs/apk/debug/FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-debug.apk
