name: "Build and Sign Android APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building FinSight India v$VERSION (Run #${{ github.run_number }})"

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Stamp Version into Android Project
        run: |
          sed -i 's/versionCode 1/versionCode ${{ github.run_number }}/g' android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "${{ steps.pkg.outputs.version }}"/g' android/app/build.gradle || true

      - name: Generate Release Keystore (Option A Automated Signing)
        run: |
          keytool -genkeypair -v \
            -keystore android/finsight-release-key.jks \
            -alias finsightkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass androidrelease123 \
            -keypass androidrelease123 \
            -dname "CN=FinSight India, OU=Mobile Analytics, O=FinSight, L=Bengaluru, ST=Karnataka, C=IN"

      - name: Configure Gradle Release Signing
        run: |
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', '''signingConfigs {
                  release {
                      storeFile file('../finsight-release-key.jks')
                      storePassword 'androidrelease123'
                      keyAlias 'finsightkey'
                      keyPassword 'androidrelease123'
                  }
              }
              buildTypes {''')

          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('minifyEnabled false', '''signingConfig signingConfigs.release
                      minifyEnabled false''')

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Successfully injected release signing config into build.gradle')
          "

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            TARGET_NAME="FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed.apk"
            cp "$RELEASE_APK" "app/build/outputs/apk/release/$TARGET_NAME"
            echo "Successfully generated signed release APK: $TARGET_NAME"
          else
            echo "Error: No release APK found."
            exit 1
          fi

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed
          path: android/app/build/outputs/apk/release/FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed.apk
