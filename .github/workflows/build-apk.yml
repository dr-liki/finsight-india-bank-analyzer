name: "Build and Sign Android APK"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building FinSight India v$VERSION (Run #${{ github.run_number }})"

      - name: Install Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Initialize Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Stamp Version into Android Project
        run: |
          RUN_VC=$((1000 + ${{ github.run_number }}))
          sed -i "s/versionCode 1/versionCode $RUN_VC/g" android/app/build.gradle || true
          sed -i 's/versionName "1.0"/versionName "${{ steps.pkg.outputs.version }}"/g' android/app/build.gradle || true

      - name: Deploy Consistent Release Keystore & MD3 App Resources
        run: |
          mkdir -p android
          # Copy persistent keystore to ensure zero install conflicts across updates
          if [ -f "certs/finsight-release-key.keystore" ]; then
            cp certs/finsight-release-key.keystore android/finsight-release-key.keystore
          else
            echo "Decoding from base64 fallback..."
            base64 -d certs/keystore.base64 > android/finsight-release-key.keystore
          fi

          # Deploy MD3 adaptive icon XMLs and colors
          if [ -d "android-res" ]; then
            cp -r android-res/* android/app/src/main/res/
            echo "Successfully deployed MD3 adaptive icon resources"
          fi

          # Generate crisp legacy PNG icons from SVG for complete launcher compatibility
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 48 -h 48 public/icon.svg -o android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          rsvg-convert -w 72 -h 72 public/icon.svg -o android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          rsvg-convert -w 96 -h 96 public/icon.svg -o android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          rsvg-convert -w 144 -h 144 public/icon.svg -o android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          rsvg-convert -w 192 -h 192 public/icon.svg -o android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

          cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png || true
          cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png || true
          cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png || true
          cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png || true
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true

      - name: Configure Gradle Release Signing
        run: |
          python3 -c "
          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          if 'signingConfigs {' not in content:
              content = content.replace('buildTypes {', '''signingConfigs {
                  release {
                      storeFile file('../finsight-release-key.keystore')
                      storePassword 'androidrelease123'
                      keyAlias 'finsightkey'
                      keyPassword 'androidrelease123'
                      storeType 'PKCS12'
                  }
              }
              buildTypes {''')

          if 'signingConfig signingConfigs.release' not in content:
              content = content.replace('minifyEnabled false', '''signingConfig signingConfigs.release
                      minifyEnabled false''')

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)
          print('Successfully injected release signing config into build.gradle')
          "

      - name: Build Signed Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            TARGET_NAME="FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed.apk"
            cp "$RELEASE_APK" "app/build/outputs/apk/release/$TARGET_NAME"
            echo "Successfully generated signed release APK: $TARGET_NAME"
          else
            echo "Error: No release APK found."
            exit 1
          fi

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed
          path: android/app/build/outputs/apk/release/FinSight-India-v${{ steps.pkg.outputs.version }}-b${{ github.run_number }}-release-signed.apk
